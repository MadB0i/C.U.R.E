[package]
name = "cure_cli"
version.workspace = true
edition.workspace = true
description = "C.U.R.E command-line interface: scan, diff, quarantine, undo"

[[bin]]
name = "cure"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
cure_core = { path = "../core" }
serde_json = "1"

# Peak working set for the storage benchmark. Windows-only and read-only.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"]
