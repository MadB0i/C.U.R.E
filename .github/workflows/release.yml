name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  release:
    name: Build release binaries
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Refuse an existing published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $lookup = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; never overwrite published assets.' }
          if (($lookup -join "`n") -notmatch 'HTTP 404') { throw "Cannot establish whether release exists: $lookup" }
          $global:LASTEXITCODE = 0

      - name: Verify Rust before packaging
        shell: pwsh
        run: |
          cargo test --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --manifest-path gui/src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --manifest-path gui/src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path gui/src-tauri/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify the browser quality suite
        shell: pwsh
        run: |
          node --check gui/dist/app.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check gui/dist/luma.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check gui/dist/storage-workstation.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check gui/dist/xray.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check gui/dist/mock-tauri.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r gui/devtools/requirements.txt
          python -m playwright install chromium
          Push-Location gui/devtools
          npm ci
          if ($LASTEXITCODE) { Pop-Location; exit $LASTEXITCODE }
          Pop-Location
          python gui/devtools/evidence-console.py all

      - name: Build production binaries with private build paths remapped
        shell: pwsh
        run: ./tools/build-release.ps1

      - name: Stage the candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path candidate/portable/docs/media -Force
          Copy-Item gui/src-tauri/target/release/cure-gui.exe candidate/portable/
          Copy-Item target/release/cure.exe candidate/portable/
          Copy-Item target/release/cure-watch.exe candidate/portable/
          Copy-Item README.md, LICENSE, SECURITY.md candidate/portable/
          Copy-Item docs/RELEASE-NOTES-0.2.0.md candidate/portable/RELEASE-NOTES.md
          New-Item -ItemType Directory -Path candidate/portable/docs/screenshots -Force
          Copy-Item docs/screenshots/*.png candidate/portable/docs/screenshots/
          Copy-Item docs/media/demo.gif candidate/portable/docs/media/
          @("Version: $env:GITHUB_REF_NAME", "Source commit: $env:GITHUB_SHA", 'Unsigned binaries.') |
            Set-Content -Encoding ascii candidate/portable/BUILD-INFO.txt
          $binarySums = Get-ChildItem candidate/portable/*.exe | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          $binarySums | Set-Content -Encoding ascii candidate/portable/SHA256SUMS.txt
          Compress-Archive -Path candidate/portable/* -DestinationPath "candidate/cure-$env:GITHUB_REF_NAME.zip"
          $zip = Get-Item "candidate/cure-$env:GITHUB_REF_NAME.zip"
          $allSums = @($binarySums) + "$((Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($zip.Name)"
          $allSums | Set-Content -Encoding ascii candidate/SHA256SUMS.txt

      - name: Audit the candidate (blocking)
        shell: pwsh
        run: |
          # The audit is a gate, not a report: a candidate that does not pass
          # it is never published.
          python tools/audit-candidate.py candidate
          if ($LASTEXITCODE) { throw 'The candidate failed the release audit.' }

      - name: Build the Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: gui/src-tauri
          args: --bundles nsis
          tauriScript: npm run tauri

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            candidate/cure-${{ github.ref_name }}.zip
            candidate/portable/cure-gui.exe
            candidate/portable/cure.exe
            candidate/portable/cure-watch.exe
            candidate/SHA256SUMS.txt
            gui/src-tauri/target/release/bundle/nsis/*.exe
          body_path: docs/RELEASE-NOTES-0.2.0.md
          generate_release_notes: true
