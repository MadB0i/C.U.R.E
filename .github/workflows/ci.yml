name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  frontend-net:
    name: No remote URLs in shipped frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on remote asset URLs in gui/dist
        shell: pwsh
        run: |
          # The shipped webview UI must work fully offline. The only allowed
          # http(s) string is the SVG namespace constant (never fetched).
          $hits = Select-String -Path 'gui/dist/*' -Pattern 'https?://' |
            Where-Object { $_.Line -notmatch 'http://www\.w3\.org/2000/svg' }
          if ($hits) {
            $hits | ForEach-Object { Write-Output "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }
          Write-Output 'no remote URLs in gui/dist'

  test:
    name: Test (workspace)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Check workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check formatting
        run: cargo fmt --check

  gui-quality:
    name: Evidence Console states, accessibility and pixels
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: gui/devtools
      - run: python -m pip install -r gui/devtools/requirements.txt
      - run: python -m playwright install chromium
      - name: JavaScript syntax
        shell: pwsh
        run: Get-ChildItem gui/dist/*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
      - run: python gui/devtools/evidence-console.py all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-console-quality
          path: gui/dev-screenshots/

  build-gui:
    name: Build GUI
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui
      - name: Build GUI (release)
        run: cargo build --release
        working-directory: gui/src-tauri
      - name: Run headless-safe GUI tests (desktop tests are #[ignore]d)
        run: cargo test
        working-directory: gui/src-tauri
      - name: GUI formatting
        run: cargo fmt --check
        working-directory: gui/src-tauri
      - name: GUI clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: gui/src-tauri
      - name: Upload cure-gui artifact
        uses: actions/upload-artifact@v4
        with:
          name: cure-gui
          path: gui/src-tauri/target/release/cure-gui.exe
          retention-days: 14

  build-watch:
    name: Build Watch
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: watch
      - name: Build cure-watch (release)
        run: cargo build --release -p cure_watch
      - name: Upload cure-watch artifact
        uses: actions/upload-artifact@v4
        with:
          name: cure-watch
          path: target/release/cure-watch.exe
          retention-days: 14
