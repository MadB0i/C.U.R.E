name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  frontend-net:
    name: No remote URLs in shipped frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on remote asset URLs in gui/dist
        shell: pwsh
        run: |
          # The shipped webview UI must work fully offline. The only allowed
          # http(s) string is the SVG namespace constant (never fetched).
          $hits = Select-String -Path 'gui/dist/*' -Pattern 'https?://' |
            Where-Object { $_.Line -notmatch 'http://www\.w3\.org/2000/svg' }
          if ($hits) {
            $hits | ForEach-Object { Write-Output "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }
          Write-Output 'no remote URLs in gui/dist'

  test:
    name: Test (workspace)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Check workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check formatting
        run: cargo fmt --check

  gui-quality:
    name: Evidence Console states, accessibility and pixels
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: gui/devtools
      - run: python -m pip install -r gui/devtools/requirements.txt
      - run: python -m playwright install chromium
      - name: JavaScript syntax
        shell: pwsh
        run: Get-ChildItem gui/dist/*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
      - run: python gui/devtools/evidence-console.py all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-console-quality
          path: gui/dev-screenshots/

  build-gui:
    name: Build GUI
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui
      - name: Build GUI (release)
        run: cargo build --release
        working-directory: gui/src-tauri
        timeout-minutes: 30
      - name: Run headless-safe GUI tests (desktop tests are #[ignore]d)
        run: cargo test
        working-directory: gui/src-tauri
      - name: GUI formatting
        run: cargo fmt --check
        working-directory: gui/src-tauri
      - name: GUI clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: gui/src-tauri
      - name: Native smoke test (launches the real window, then closes it)
        shell: pwsh
        run: |
          # Proves the release binary actually starts and creates a window.
          # The app owns its data under %LOCALAPPDATA%\CURE and must not
          # write anything next to the executable.
          $exe = "$PWD/gui/src-tauri/target/release/cure-gui.exe"
          $before = Get-ChildItem "$PWD/gui/src-tauri/target/release" -File |
            Select-Object -ExpandProperty Name
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $proc.Refresh()
          if ($proc.HasExited) {
            Write-Error "cure-gui.exe exited early with code $($proc.ExitCode)"
            exit 1
          }
          $proc | Select-Object Id, @{n='WorkingSetMB';e={[math]::Round($_.WorkingSet64/1MB,1)}},
                                 @{n='Threads';e={$_.Threads.Count}},
                                 @{n='Window';e={$_.MainWindowTitle}} | Format-List
          if (-not $proc.MainWindowTitle) {
            Write-Error "cure-gui.exe started but opened no window"
            Stop-Process -Id $proc.Id -Force
            exit 1
          }
          Stop-Process -Id $proc.Id -Force
          Start-Sleep -Seconds 2
          $after = Get-ChildItem "$PWD/gui/src-tauri/target/release" -File |
            Select-Object -ExpandProperty Name
          $new = Compare-Object $before $after |
            Where-Object { $_.SideIndicator -eq '=>' -and $_.InputObject -like '*.json' }
          if ($new) {
            Write-Error "GUI wrote state next to the executable: $($new.InputObject -join ', ')"
            exit 1
          }
          Write-Output 'native smoke test passed; no exe-adjacent state files'
      - name: Native end-to-end journey
        shell: pwsh
        timeout-minutes: 30
        run: |
          # The browser suite proves the interface; this proves the product.
          # It drives the real release binary through the real webview and
          # the real Rust backend, and the only file it ever removes is one
          # it created itself inside the system temporary directory.
          # Note: we only need Playwright for connect_over_cdp (CDP to WebView2);
          # bundled Chromium is not used and is not installed here.
          python -m pip install -r gui/devtools/requirements.txt
          python testing/native/native-e2e.py --shots docs/native-captures
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: E2E diagnostics on failure
        if: always()
        shell: pwsh
        run: |
          Write-Output "=== E2E diagnostic snapshot (always-runs) ==="
          Write-Output "--- cure-gui processes ---"
          Get-Process -Name cure-gui -ErrorAction SilentlyContinue |
            Select-Object Id, StartTime, MainWindowTitle | Format-Table -AutoSize
          Write-Output "--- msedgewebview2 processes ---"
          Get-Process -Name msedgewebview2 -ErrorAction SilentlyContinue |
            Select-Object Id, StartTime | Format-Table -AutoSize
          Write-Output "--- CDP port 9333 probe ---"
          try {
            $resp = Invoke-WebRequest -Uri "http://127.0.0.1:9333/json/version" -TimeoutSec 3 -UseBasicParsing
            Write-Output $resp.Content
          } catch {
            Write-Output "CDP probe failed: $($_.Exception.Message)"
          }
          Write-Output "--- netstat for port 9333 ---"
          netstat -ano | Select-String ":9333 "

      - name: Upload cure-gui artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cure-gui
          path: |
            gui/src-tauri/target/release/cure-gui.exe
            docs/native-captures/
          retention-days: 14

  build-cli:
    name: Build CLI and exercise the storage engine
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - name: Build cure.exe (release)
        run: cargo build --release -p cure_cli
      - name: Storage engine end-to-end on a synthetic tree
        run: |
          # Exercises walk → classify → hash-verify → report on a clean
          # runner, with no dependence on whatever the machine happens to hold.
          .\target\release\cure.exe storage bench --files 2000 --size 4096 --copies 4
      - name: Upload cure.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: cure-cli
          path: target/release/cure.exe
          retention-days: 14

  build-watch:
    name: Build Watch
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: watch
      - name: Build cure-watch (release)
        run: cargo build --release -p cure_watch
      - name: Upload cure-watch artifact
        uses: actions/upload-artifact@v4
        with:
          name: cure-watch
          path: target/release/cure-watch.exe
          retention-days: 14
