name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  frontend-net:
    name: No remote URLs in shipped frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on remote asset URLs in gui/dist
        shell: pwsh
        run: |
          # The shipped webview UI must work fully offline. The only allowed
          # http(s) string is the SVG namespace constant (never fetched).
          $hits = Select-String -Path 'gui/dist/*' -Pattern 'https?://' |
            Where-Object { $_.Line -notmatch 'http://www\.w3\.org/2000/svg' }
          if ($hits) {
            $hits | ForEach-Object { Write-Output "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }
          Write-Output 'no remote URLs in gui/dist'

  test:
    name: Test (workspace)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Check workspace clippy
        run: cargo clippy --workspace -- -D warnings

  build-gui:
    name: Build GUI
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui
      - name: Build GUI (release)
        run: cargo build --release
        working-directory: gui/src-tauri
      - name: Upload cure-gui artifact
        uses: actions/upload-artifact@v4
        with:
          name: cure-gui
          path: gui/src-tauri/target/release/cure-gui.exe
          retention-days: 14

  build-watch:
    name: Build Watch
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: watch
      - name: Build cure-watch (release)
        run: cargo build --release -p cure_watch
      - name: Upload cure-watch artifact
        uses: actions/upload-artifact@v4
        with:
          name: cure-watch
          path: target/release/cure-watch.exe
          retention-days: 14
