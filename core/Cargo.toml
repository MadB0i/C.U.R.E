[package]
name = "cure_core"
version.workspace = true
edition.workspace = true
description = "C.U.R.E engine: persistence scanning, risk scoring, baselines, safe quarantine"

[lib]
name = "cure_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
