[package]
name = "cure_watch"
version.workspace = true
edition.workspace = true
description = "C.U.R.E background watcher: auto-launches the rescue GUI when a trigger USB is inserted"

[[bin]]
name = "cure-watch"
path = "src/main.rs"

[dependencies]
cure_core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
tempfile = "3"
